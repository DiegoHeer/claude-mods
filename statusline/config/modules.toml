# cship — module settings shared by both layouts; statusline.sh appends this to layout-*.toml

[cship.model]
symbol = ""
style  = "bold fg:#7aa2f7"

[cship.cost]
symbol             = ""
style              = "fg:#9ece6a"
warn_threshold     = 2.0
warn_style         = "fg:#e0af68"
critical_threshold = 5.0
critical_style     = "bold fg:#f7768e"

[cship.context_bar]
width              = 10
filled_char        = "█"
empty_char         = "░"
style              = "fg:#bb9af7"
warn_threshold     = 60.0
warn_style         = "fg:#e0af68"
critical_threshold = 80.0
critical_style     = "bold fg:#f7768e"

[cship.usage_limits]
five_hour_format   = "5h {pct}% ({reset})"
seven_day_format   = "7d {pct}% ({reset})"
separator          = " │ "
style              = "fg:#9ece6a"
warn_threshold     = 60.0
warn_style         = "fg:#e0af68"
critical_threshold = 80.0
critical_style     = "bold fg:#f7768e"
